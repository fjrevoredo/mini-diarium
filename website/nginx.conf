# Routing/header rules here ship to production: Coolify builds website/Dockerfile, which
# COPYs this file to /etc/nginx/conf.d/default.conf. Only redirect/TLS/canonical-host
# enforcement is Coolify-overridden (see website/CLAUDE.md "Production Configuration").
# The site moved from mini-diarium.com to fenmark.app when the app was renamed to Fenmark.
# Keep the old domain registered and pointed here indefinitely. Coolify must route all four
# host names to this container (with TLS) for these blocks to receive the requests.

# Old domain: the homepage shows a self-contained transition page (legacy-domain/index.html)
# with a button to fenmark.app. Every other path permanently redirects to the same path on
# fenmark.app, so old deep links, bookmarks, and backlinks keep working.
server {
    listen 80;
    server_name mini-diarium.com www.mini-diarium.com;
    root /usr/share/nginx/html/legacy-domain;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "no-referrer";
    }

    location / {
        return 301 https://fenmark.app$request_uri;
    }
}

server {
    listen 80;
    server_name www.fenmark.app;
    return 301 https://fenmark.app$request_uri;
}

server {
    listen 80;
    server_name fenmark.app localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # The old-domain transition page is served only on mini-diarium.com (block above).
    location ^~ /legacy-domain/ {
        return 404;
    }

    # Cache control: immutable static assets
    location ~* \.(css|js|webp|png|jpg|jpeg|svg|ico|woff2?|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "no-referrer";
    }

    # Cache policy artifacts should refresh quickly
    location = /ai-crawlers.txt {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "no-referrer";
    }

    location = /llms.txt {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "no-referrer";
    }

    location = /llms-full.txt {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "no-referrer";
    }

    # Per-page Markdown mirrors (website/docs/<slug>.md). Canonicalized to the HTML page via
    # an rel="canonical" Link header (Google's documented method for non-HTML resources) so
    # ranking signal consolidates there instead of treating the mirror as duplicate content.
    # No try_files here: a missing slug must 404, not silently fall through to index.html.
    location ~* ^/docs/(?<docslug>[^/]+)\.md$ {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600";
        add_header Link "<https://fenmark.app/docs/$docslug/>; rel=\"canonical\"" always;
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "no-referrer";
    }

    # No cache for HTML (always fresh)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "no-referrer";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "no-referrer";
    }

    # Disable access log for favicon/robots to reduce noise
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
