name: Nix

permissions:
  contents: read

on:
  push:
    branches: [master]
    paths:
      - 'package-lock.json'
      - 'nix/**'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/nix.yml'
  pull_request:
    branches: [master]
    paths:
      - 'package-lock.json'
      - 'nix/**'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/nix.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix-build:
    name: Nix build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # The job never commits. A stale npmDepsHash fails the run and prints the
      # new hash, so a human applies it (branch protection rejects bot pushes).
      - name: Build
        run: |
          set -o pipefail
          BUILD_EXIT=0
          nix build .#default --no-link 2>&1 | tee /tmp/nix-build.log || BUILD_EXIT=$?

          if [ "$BUILD_EXIT" -ne 0 ]; then
            # `|| true`: no `got:` line is a normal outcome (a real build
            # error); under `bash -e` + pipefail it would abort the step.
            GOT=$(grep -E '^[[:space:]]*got:' /tmp/nix-build.log | awk '{print $NF}' | head -1 || true)
            if [ -n "$GOT" ]; then
              MSG="npmDepsHash is stale. Set it to $GOT"
              echo "::error file=nix/package.nix::$MSG"
              {
                echo "### Nix build failed: stale npmDepsHash"
                echo ""
                echo "Set \`npmDepsHash\` in \`nix/package.nix\` to:"
                echo ""
                echo "\`\`\`"
                echo "$GOT"
                echo "\`\`\`"
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::nix build failed (exit $BUILD_EXIT). See the log above."
            fi
          fi

          exit "$BUILD_EXIT"
