name: Publish to Flathub

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.4.14)'
        required: true

jobs:
  publish-flathub:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine tag and version
        id: prep
        run: |
          tag="${{ inputs.tag || github.event.release.tag_name || github.ref_name }}"
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Get commit SHA for tag
        id: sha
        run: |
          # git rev-list dereferences annotated tags to their commit SHA.
          # Full clone (fetch-depth: 0 + fetch-tags: true) ensures all tags are present.
          commit=$(git rev-list -n 1 "${{ steps.prep.outputs.tag }}")
          if [ -z "$commit" ]; then
            echo "Could not resolve commit SHA for ${{ steps.prep.outputs.tag }}"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Verify FLATHUB_TOKEN secret is set
        run: |
          if [ -z "${{ secrets.FLATHUB_TOKEN }}" ]; then
            echo "FLATHUB_TOKEN secret is not set."
            echo "Add it at Settings → Secrets and variables → Actions after Flathub accepts the initial submission."
            exit 1
          fi
          echo "FLATHUB_TOKEN is configured."

      - name: Set up Python 3
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.x'

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install flatpak-builder-tools
        run: |
          git clone --depth=1 https://github.com/flatpak/flatpak-builder-tools.git /tmp/flatpak-builder-tools
          pip install aiohttp toml tomlkit

      - name: Prepare tagged source tree
        run: |
          rm -rf /tmp/mini-diarium-release
          git worktree add --detach /tmp/mini-diarium-release "${{ steps.sha.outputs.commit }}"

      - name: Validate tagged metainfo for Flathub
        run: |
          metainfo=/tmp/mini-diarium-release/data/linux/io.github.fjrevoredo.mini-diarium.metainfo.xml
          version="${{ steps.prep.outputs.version }}"
          tag="${{ steps.prep.outputs.tag }}"

          if ! grep -q '<developer id="io.github.fjrevoredo">' "$metainfo"; then
            echo "Tagged release metainfo is missing <developer id=\"io.github.fjrevoredo\">."
            echo "Flathub will reject this build during AppStream validation."
            echo "Cut a new release after fixing data/linux/io.github.fjrevoredo.mini-diarium.metainfo.xml, or patch the Flathub PR manually."
            exit 1
          fi

          if ! grep -q '<url type="vcs-browser">https://github.com/fjrevoredo/mini-diarium</url>' "$metainfo"; then
            echo "Tagged release metainfo is missing the vcs-browser URL."
            echo "Flathub will reject this build during AppStream validation."
            echo "Cut a new release after fixing data/linux/io.github.fjrevoredo.mini-diarium.metainfo.xml, or patch the Flathub PR manually."
            exit 1
          fi

          if ! grep -q "<release version=\"$version\"" "$metainfo"; then
            echo "Tagged release metainfo is missing a <release version=\"$version\"> entry."
            echo "Flathub may publish the new build while still showing the previous version in AppStream metadata."
            echo "Update the <releases> block before cutting the release tag."
            exit 1
          fi

          if ! grep -q "<url type=\"details\">https://github.com/fjrevoredo/mini-diarium/releases/tag/$tag</url>" "$metainfo"; then
            echo "Tagged release metainfo is missing the matching release details URL for $tag."
            echo "Update the <releases> block before cutting the release tag."
            exit 1
          fi

      - name: Validate manifest font paths against tagged tree
        run: |
          manifest=/tmp/mini-diarium-release/flatpak/io.github.fjrevoredo.mini-diarium.yml
          release_tree=/tmp/mini-diarium-release

          # Only run if the manifest installs fonts into the sandbox
          if ! grep -qF 'app/share/fonts' "$manifest"; then
            echo "No font install commands in manifest — skipping."
            exit 0
          fi

          # Extract source globs from install commands that target /app/share/fonts.
          # Example line: install -Dm644 fonts/*.ttf -t /app/share/fonts/
          # We capture the word between the mode flags (-Dm644) and the destination.
          font_sources=$(grep 'app/share/fonts' "$manifest" | \
            sed -n 's/.*install [^ ]* \([^ ]*\) .*app\/share\/fonts.*/\1/p')

          if [ -z "$font_sources" ]; then
            echo "WARNING: Font install lines found but could not parse source path. Skipping."
            exit 0
          fi

          for src in $font_sources; do
            # Strip the glob portion to get the parent directory
            dir="${src%/*}"
            if [ -z "$dir" ] || [ "$dir" = "$src" ]; then
              echo "ERROR: Cannot determine directory from font source path '$src'."
              exit 1
            fi

            if [ ! -d "$release_tree/$dir" ]; then
              echo "ERROR: Font source directory '$dir/' does not exist in the tagged release tree."
              echo "The manifest references '$src' but the directory is missing."
              echo "Fix the path in flatpak/io.github.fjrevoredo.mini-diarium.yml before tagging."
              exit 1
            fi

            count=$(find "$release_tree/$dir" -maxdepth 1 \( -name '*.ttf' -o -name '*.otf' \) 2>/dev/null | wc -l)
            if [ "$count" -eq 0 ]; then
              echo "ERROR: Font source directory '$dir/' exists but contains no .ttf / .otf files."
              exit 1
            fi
            echo "Font source directory '$dir/' validated: $count file(s)."
          done

      - name: Validate package-lock.json for offline npm
        run: |
          lockfile=/tmp/mini-diarium-release/package-lock.json

          if ! grep -q '"resolved"' "$lockfile"; then
            echo "package-lock.json is missing resolved URLs."
            echo "Regenerate it with real npm, not Bun's npm shim:"
            echo "npm install --package-lock-only --ignore-scripts --legacy-peer-deps"
            exit 1
          fi

          if ! grep -q '"integrity"' "$lockfile"; then
            echo "package-lock.json is missing integrity hashes."
            echo "Regenerate it with real npm, not Bun's npm shim:"
            echo "npm install --package-lock-only --ignore-scripts --legacy-peer-deps"
            exit 1
          fi

      - name: Generate cargo-sources.json
        run: |
          python3 /tmp/flatpak-builder-tools/cargo/flatpak-cargo-generator.py \
            /tmp/mini-diarium-release/src-tauri/Cargo.lock \
            -o /tmp/mini-diarium-release/flatpak/cargo-sources.json

      - name: Generate node-sources.json
        run: |
          node "${GITHUB_WORKSPACE}/flatpak/generate-node-sources.mjs" \
            /tmp/mini-diarium-release/package-lock.json \
            /tmp/mini-diarium-release/flatpak/node-sources.json \
            "$HOME/.npm"

      - name: Rewrite manifest for Flathub repo layout
        env:
          COMMIT: ${{ steps.sha.outputs.commit }}
        working-directory: /tmp/mini-diarium-release
        run: python3 "${GITHUB_WORKSPACE}/flatpak/rewrite-manifest.py"

      - name: Clone Flathub repository
        env:
          FLATHUB_TOKEN: ${{ secrets.FLATHUB_TOKEN }}
        run: |
          git clone \
            "https://x-access-token:${FLATHUB_TOKEN}@github.com/flathub/io.github.fjrevoredo.mini-diarium.git" \
            /tmp/flathub-repo

      - name: Copy files into Flathub repo
        run: |
          cp /tmp/mini-diarium-release/flatpak/io.github.fjrevoredo.mini-diarium.yml /tmp/flathub-repo/io.github.fjrevoredo.mini-diarium.yml
          cp /tmp/mini-diarium-release/flatpak/cargo-sources.json                    /tmp/flathub-repo/cargo-sources.json
          cp /tmp/mini-diarium-release/flatpak/node-sources.json                     /tmp/flathub-repo/node-sources.json

      - name: Commit and open PR against Flathub repo
        env:
          FLATHUB_TOKEN: ${{ secrets.FLATHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.FLATHUB_TOKEN }}
        run: |
          tag="${{ steps.prep.outputs.tag }}"
          version="${{ steps.prep.outputs.version }}"
          branch="update-${version}"

          cd /tmp/flathub-repo

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$branch"
          git add .
          git diff --cached --quiet && echo "No changes to commit." && exit 0
          git commit -m "Update to ${version}"
          git push --force-with-lease origin "HEAD:${branch}"

          gh pr create \
            --repo "flathub/io.github.fjrevoredo.mini-diarium" \
            --base master \
            --head "$branch" \
            --title "Update to ${version}" \
            --body "Automated update from https://github.com/fjrevoredo/mini-diarium/releases/tag/${tag}" \
          || echo "PR may already exist; check https://github.com/flathub/io.github.fjrevoredo.mini-diarium/pulls"
