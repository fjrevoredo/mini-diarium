name: IndexNow Submission

permissions: {}

on:
  workflow_dispatch:
    description: "Manually submit all sitemap URLs to IndexNow"
  # push:
  #   branches: [master]
  #   paths:
  #     - "website/**"
  #     - "posts-src/**"
  #     - "docs-src/**"
  #     - "scripts/**"
  #     - "package.json"
  # TODO: Uncomment the push trigger above once Coolify auto-deployment is configured.
  # Until then, use workflow_dispatch to submit after manually deploying the website.

jobs:
  submit:
    name: Submit URLs to IndexNow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build website (regenerate sitemap)
        run: bun run website:build-static

      - name: Submit URLs to IndexNow
        run: bun run website:submit-indexnow
