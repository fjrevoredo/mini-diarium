name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  LATEST_CHANGELOG_FILE: latest-changelog.md
  LATEST_CHANGELOG_TEMPLATE: latest-changelog.example.md

jobs:
  create-release:
    name: Create Release Draft
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Validate latest changelog file
        shell: bash
        run: |
          if [ ! -f "$LATEST_CHANGELOG_FILE" ]; then
            echo "Missing $LATEST_CHANGELOG_FILE in the tagged commit."
            echo "Create it from $LATEST_CHANGELOG_TEMPLATE before tagging the release."
            exit 1
          fi

          if [ ! -s "$LATEST_CHANGELOG_FILE" ]; then
            echo "$LATEST_CHANGELOG_FILE is empty."
            exit 1
          fi

          if ! grep -q '[^[:space:]]' "$LATEST_CHANGELOG_FILE"; then
            echo "$LATEST_CHANGELOG_FILE only contains whitespace."
            exit 1
          fi

          if [ -f "$LATEST_CHANGELOG_TEMPLATE" ] && cmp -s "$LATEST_CHANGELOG_FILE" "$LATEST_CHANGELOG_TEMPLATE"; then
            echo "$LATEST_CHANGELOG_FILE still matches the untouched template."
            exit 1
          fi

          if grep -q 'REPLACE BEFORE TAGGING' "$LATEST_CHANGELOG_FILE"; then
            echo "$LATEST_CHANGELOG_FILE still contains placeholder text."
            exit 1
          fi

      - name: Create draft release from latest changelog
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.get_version.outputs.version }}
          draft: true
          prerelease: false
          body_path: ${{ env.LATEST_CHANGELOG_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-release:
    name: Build Release (${{ matrix.platform }})
    needs: create-release
    if: (!cancelled()) && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x86_64
          - os: macos-latest
            platform: macos
            arch: universal
          - os: windows-latest
            platform: windows
            arch: x86_64

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - name: Cache cargo dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install macOS Rust targets (universal binary)
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Configure macOS DMG bundling for headless CI
        if: matrix.platform == 'macos'
        run: |
          echo "JENKINS_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Clear stale bundle artifacts from cache
        shell: bash
        run: rm -rf target/release/bundle

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.platform == 'macos' && '--target universal-apple-darwin' || '' }}

      - name: Debug macOS DMG bundling failure
        if: failure() && matrix.platform == 'macos'
        run: |
          echo "Dumping generated bundle_dmg.sh scripts (if any):"
          find target -name "bundle_dmg.sh" -print -exec sed -n '1,260p' {} \;

      - name: Prepare release artifacts (Linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p release-artifacts
          VERSION="${{ needs.create-release.outputs.version }}"
          VERSION="${VERSION:-dev-${GITHUB_SHA::7}}"

          find target/release/bundle -name "*.AppImage" -exec cp {} release-artifacts/Mini-Diarium-${VERSION}-linux.AppImage \;
          find target/release/bundle -name "*.deb" -exec cp {} release-artifacts/Mini-Diarium-${VERSION}-linux.deb \;

          cd release-artifacts
          sha256sum * > checksums-linux.txt
          cat checksums-linux.txt

      - name: Prepare release artifacts (macOS)
        if: matrix.platform == 'macos'
        run: |
          mkdir -p release-artifacts
          VERSION="${{ needs.create-release.outputs.version }}"
          VERSION="${VERSION:-dev-${GITHUB_SHA::7}}"

          find target/universal-apple-darwin/release/bundle -name "*.dmg" -exec cp {} release-artifacts/Mini-Diarium-${VERSION}-macos.dmg \;

          cd release-artifacts
          shasum -a 256 * > checksums-macos.txt
          cat checksums-macos.txt

      - name: Prepare release artifacts (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          mkdir -p release-artifacts
          VERSION="${{ needs.create-release.outputs.version }}"
          VERSION="${VERSION:-dev-${GITHUB_SHA::7}}"

          find target/release/bundle -name "*.msi" -exec cp {} release-artifacts/Mini-Diarium-${VERSION}-windows.msi \;
          find target/release/bundle/nsis -name "*.exe" -exec cp {} release-artifacts/Mini-Diarium-${VERSION}-windows.exe \; || true

          cd release-artifacts
          sha256sum * > checksums-windows.txt
          cat checksums-windows.txt

      - name: Verify release artifacts are present
        shell: bash
        run: |
          if [ ! -d release-artifacts ]; then
            echo "release-artifacts directory is missing"
            exit 1
          fi

          ls -lh release-artifacts

          if [ "$(find release-artifacts -maxdepth 1 -type f | wc -l)" -eq 0 ]; then
            echo "No release artifacts were prepared"
            exit 1
          fi

      - name: Upload release artifacts
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts for manual inspection
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-artifacts-${{ matrix.platform }}
          path: release-artifacts/*
          retention-days: 7

  publish-release:
    name: Publish Release
    if: github.event_name == 'push'
    needs:
      - create-release
      - build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Verify expected release assets exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${{ needs.create-release.outputs.version }}"
          assets="$(gh release view "$tag" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')"

          printf '%s\n' "$assets"

          for expected in \
            "Mini-Diarium-${version}-windows.exe" \
            "Mini-Diarium-${version}-windows.msi" \
            "Mini-Diarium-${version}-macos.dmg" \
            "Mini-Diarium-${version}-linux.AppImage" \
            "Mini-Diarium-${version}-linux.deb"
          do
            if ! printf '%s\n' "$assets" | grep -Fxq "$expected"; then
              echo "Missing expected release asset: $expected"
              exit 1
            fi
          done

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --repo "${{ github.repository }}" --draft=false

      - name: Trigger WinGet publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run winget-publish.yml \
            --repo "${{ github.repository }}" \
            --ref master \
            --field tag="$GITHUB_REF_NAME"

      - name: Trigger Homebrew cask update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run homebrew-cask.yml \
            --repo "${{ github.repository }}" \
            --ref master \
            --field tag="$GITHUB_REF_NAME"

      - name: Trigger Flathub publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run flathub-publish.yml \
            --repo "${{ github.repository }}" \
            --ref master \
            --field tag="$GITHUB_REF_NAME"

      # Best-effort: the product is live on the Store, but the update still needs the
      # PARTNER_CENTER_* / MSSTORE_PRODUCT_ID secrets to be configured. A failure here
      # (e.g. secrets not yet set) must not fail the release, so this step is non-blocking.
      # This is the ONLY trigger for msstore-publish.yml — it has no `release:` trigger, so
      # do not add one here or the release would submit twice.
      - name: Trigger Microsoft Store publish
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run msstore-publish.yml \
            --repo "${{ github.repository }}" \
            --ref master \
            --field tag="$GITHUB_REF_NAME"

      - name: Check out master for changelog cleanup
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: master
          fetch-depth: 0

      - name: Create cleanup PR when latest changelog matches the tagged release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_file="$(mktemp)"
          git show "${GITHUB_REF_NAME}:${LATEST_CHANGELOG_FILE}" > "$tag_file"

          if [ ! -f "$LATEST_CHANGELOG_FILE" ]; then
            echo "$LATEST_CHANGELOG_FILE is already absent on master; skipping cleanup PR."
            exit 0
          fi

          if ! cmp -s "$LATEST_CHANGELOG_FILE" "$tag_file"; then
            echo "$LATEST_CHANGELOG_FILE has changed on master since the tag was created; skipping cleanup PR."
            exit 0
          fi

          cleanup_branch="automation/clear-latest-changelog-${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$cleanup_branch"
          git rm "$LATEST_CHANGELOG_FILE"
          git commit -m "chore(release): clear latest changelog after ${GITHUB_REF_NAME}"
          git push --force-with-lease origin "HEAD:${cleanup_branch}"

          existing_pr="$(gh pr list --head "$cleanup_branch" --base master --state open --json number --jq '.[0].number')"
          if [ -n "$existing_pr" ] && [ "$existing_pr" != "null" ]; then
            echo "Cleanup PR #${existing_pr} already exists."
            exit 0
          fi

          gh pr create \
            --base master \
            --head "$cleanup_branch" \
            --title "chore(release): clear latest changelog after ${GITHUB_REF_NAME}" \
            --body "Automated cleanup PR created after publishing ${GITHUB_REF_NAME}. Removes ${LATEST_CHANGELOG_FILE} so the next release must create a fresh copy from ${LATEST_CHANGELOG_TEMPLATE}."
