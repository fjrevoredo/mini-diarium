name: Benchmarks

permissions:
  contents: write

on:
  push:
    branches: [master]

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust-bench:
    name: Rust Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Run benchmarks (bencher output format)
        working-directory: src-tauri
        run: cargo bench --benches -- --output-format bencher | tee ../bench-output.txt

      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: cargo
          output-file-path: bench-output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '200%'
          comment-on-alert: true
          fail-on-alert: false
          benchmark-data-dir-path: benchmarks

      - name: Publish custom report page
        run: |
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" \
            /tmp/gh-pages
          cp benchmarks/index.html /tmp/gh-pages/benchmarks/index.html
          cd /tmp/gh-pages
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add benchmarks/index.html
          git diff --staged --quiet || \
            (git commit -m "chore: update benchmark report page" && git push)
