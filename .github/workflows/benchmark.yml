name: Benchmarks

permissions:
  contents: write

on:
  push:
    branches: [master]

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust-bench:
    name: Rust Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Run benchmarks (bencher output format)
        working-directory: src-tauri
        run: cargo bench --benches -- --output-format bencher | tee ../bench-output.txt

      - name: Compute and publish CI pipeline duration
        if: always()
        env:
          STARTED_AT: ${{ github.run_started_at }}
        run: |
          if [ -z "$STARTED_AT" ]; then
            echo "::warning::Could not determine pipeline start time; skipping ci_pipeline_duration metric."
            exit 0
          fi
          START_EPOCH=$(date -u -d "$STARTED_AT" +"%s")
          END_EPOCH=$(date -u +"%s")
          DURATION_SEC=$(echo "$END_EPOCH - $START_EPOCH" | bc)
          DURATION_NS=$(echo "$DURATION_SEC * 1000000000" | bc | cut -d. -f1)
          echo "ci_pipeline_duration $DURATION_NS nanoseconds" >> bench-output.txt
          echo "CI pipeline duration: ${DURATION_SEC}s (${DURATION_NS}ns)"

      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: cargo
          output-file-path: bench-output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '200%'
          comment-on-alert: true
          fail-on-alert: false
          benchmark-data-dir-path: benchmarks

      - name: Publish custom report page
        run: |
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" \
            /tmp/gh-pages
          cp benchmarks/index.html /tmp/gh-pages/benchmarks/index.html
          cd /tmp/gh-pages
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add benchmarks/index.html
          git diff --staged --quiet || \
            (git commit -m "chore: update benchmark report page" && git push)
