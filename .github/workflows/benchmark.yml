name: Benchmarks

permissions:
  contents: write

on:
  push:
    branches: [master]

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust-bench:
    name: Rust Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Record job start time
        run: echo "JOB_STARTED_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: . -> target
          cache-on-failure: true

      - name: Cache and install Linux system dependencies
        uses: awalsh128/cache-apt-pkgs-action@681749ae568c81c2037cb9185e38b709b261bd2f # v1.6.1
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: 1.0
          execute_install_scripts: true

      - name: Run benchmarks (bencher output format)
        working-directory: src-tauri
        run: cargo bench --benches -- --output-format bencher | tee ../bench-output.txt

      - name: Compute and publish CI pipeline duration
        if: always()
        run: |
          END_EPOCH=$(date -u +%s)
          DURATION_SEC=$((END_EPOCH - JOB_STARTED_EPOCH))
          DURATION_NS=$((DURATION_SEC * 1000000000))
          printf "test ci_pipeline_duration ... bench: %s ns/iter (+/- 0)\n" "$DURATION_NS" >> bench-output.txt
          echo "CI pipeline duration: ${DURATION_SEC}s (${DURATION_NS}ns)"

      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1
        with:
          tool: cargo
          output-file-path: bench-output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '200%'
          comment-on-alert: true
          fail-on-alert: false
          benchmark-data-dir-path: benchmarks

      - name: Publish custom report page
        run: |
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" \
            /tmp/gh-pages
          cp benchmarks/index.html /tmp/gh-pages/benchmarks/index.html
          cd /tmp/gh-pages
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add benchmarks/index.html
          git diff --staged --quiet || \
            (git commit -m "chore: update benchmark report page" && git push)
