name: CI

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Cache and install Linux system dependencies
        uses: awalsh128/cache-apt-pkgs-action@681749ae568c81c2037cb9185e38b709b261bd2f # v1.6.1
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: 1.0
          execute_install_scripts: true

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: ESLint
        run: bun run lint

      - name: Prettier
        run: bun run format:check

      - name: TypeScript
        run: bun run type-check

      - name: Validate locales
        run: bun run validate:locales

      - name: Network isolation static check
        run: pwsh scripts/check-no-network.ps1

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rustfmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Cache D2 binary
        id: cache-d2
        uses: actions/cache@v6.1.0
        with:
          path: ~/.local/bin/d2
          key: d2-v0.7.1-linux  # bump this key when upgrading D2

      - name: Install D2
        if: steps.cache-d2.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/d2.tar.gz \
            "https://github.com/terrastruct/d2/releases/download/v0.7.1/d2-v0.7.1-linux-amd64.tar.gz"
          tar -xzf /tmp/d2.tar.gz -C /tmp
          mkdir -p ~/.local/bin
          install /tmp/d2-v0.7.1/bin/d2 ~/.local/bin/d2
          ~/.local/bin/d2 --version | grep -Eq '0\.7\.1'

      - name: Add D2 to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify diagrams are up-to-date
        run: bun run diagrams:check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Cache and install Linux system dependencies
        uses: awalsh128/cache-apt-pkgs-action@681749ae568c81c2037cb9185e38b709b261bd2f # v1.6.1
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: 1.0
          execute_install_scripts: true

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright Chromium
        id: cache-playwright
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('bun.lock') }}
          restore-keys: playwright-chromium-

      - name: Install Playwright Chromium
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Cache nextest binary
        id: cache-nextest
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: nextest-Linux-v0.9  # bump this key when upgrading nextest

      - name: Install cargo-nextest
        if: steps.cache-nextest.outputs.cache-hit != 'true'
        run: cargo install cargo-nextest --locked

      - name: Cache llvm-cov binary
        id: cache-llvm-cov
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: llvm-cov-Linux-v0.6  # bump when upgrading llvm-cov

      - name: Install cargo-llvm-cov
        if: steps.cache-llvm-cov.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov --locked

      - name: Frontend tests
        run: bun run test:coverage

      - name: Backend tests
        working-directory: src-tauri
        run: cargo llvm-cov nextest --lcov --output-path lcov.info

      - name: Print layout tests
        run: bun run test:print

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: frontend

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./src-tauri/lcov.info
          flags: backend

  build-linux:
    name: Build (Linux)
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target
          cache-targets: false   # release+LTO artifacts too large; not incrementally reusable
          cache-on-failure: false

      - name: Cache bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Cache and install Linux system dependencies
        uses: awalsh128/cache-apt-pkgs-action@681749ae568c81c2037cb9185e38b709b261bd2f # v1.6.1
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: 1.0
          execute_install_scripts: true

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_PROFILE_RELEASE_LTO: thin         # thin LTO for CI speed; release.yml uses full LTO
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "2"    # opt-level 2 sufficient for CI validation

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mini-diarium-ubuntu-latest
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: ignore

      - name: Upload Linux binary for E2E tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mini-diarium-linux-binary
          path: src-tauri/target/release/mini-diarium

  build-other:
    name: Build (${{ matrix.os }})
    needs: [lint, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - name: Fix cargo PATH (macOS arm64 workaround)
        if: runner.os == 'macOS'
        run: |
          # On macOS arm64 runners, Homebrew's rustup shims can shadow the real cargo.
          # Use rustup to resolve the actual binary and prepend its directory to PATH.
          echo "$(dirname "$(rustup which cargo)")" >> "$GITHUB_PATH"

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target
          cache-targets: false   # release+LTO artifacts too large; not incrementally reusable
          cache-on-failure: false

      - name: Cache bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Configure macOS DMG bundling for headless CI
        if: runner.os == 'macOS'
        run: echo "JENKINS_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_PROFILE_RELEASE_LTO: thin         # thin LTO for CI speed; release.yml uses full LTO
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "2"    # opt-level 2 sufficient for CI validation

      - name: Debug macOS DMG bundling failure
        if: failure() && runner.os == 'macOS'
        run: |
          echo "Dumping generated bundle_dmg.sh scripts (if any):"
          find src-tauri/target -name "bundle_dmg.sh" -print -exec sed -n '1,260p' {} \;

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mini-diarium-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: ignore

  flatpak:
    name: Flatpak (x86_64)
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Cache flatpak-builder-tools
        id: cache-fbt
        uses: actions/cache@v6.1.0
        with:
          path: /tmp/flatpak-builder-tools
          key: flatpak-builder-tools-v1  # bump when you need to refresh the clone

      - name: Clone flatpak-builder-tools
        if: steps.cache-fbt.outputs.cache-hit != 'true'
        run: git clone --depth=1 https://github.com/flatpak/flatpak-builder-tools.git /tmp/flatpak-builder-tools

      - name: Install Python dependencies for cargo generator
        run: pip install aiohttp toml tomlkit

      - name: Generate cargo-sources.json
        run: python3 /tmp/flatpak-builder-tools/cargo/flatpak-cargo-generator.py src-tauri/Cargo.lock -o flatpak/cargo-sources.json

      - name: Generate node-sources.json
        run: node flatpak/generate-node-sources.mjs package-lock.json flatpak/node-sources.json "$HOME/.npm"

      - name: Validate desktop file
        run: desktop-file-validate data/linux/io.github.fjrevoredo.mini-diarium.desktop

      - name: Validate AppStream metainfo
        run: appstreamcli validate data/linux/io.github.fjrevoredo.mini-diarium.metainfo.xml

      - uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb # v6
        with:
          manifest-path: flatpak/io.github.fjrevoredo.mini-diarium.yml
          cache-key: flatpak-builder-${{ hashFiles('flatpak/**', 'src-tauri/Cargo.lock', 'bun.lock') }}
          build-bundle: false
          arch: x86_64
          verbose: true

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build-linux   # only needs Linux binary; decoupled from slow macOS/Windows builds
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2

      - name: Cache tauri-driver binary
        id: cache-tauri-driver
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-Linux-v0.1   # bump this key when upgrading tauri-driver
          restore-keys: tauri-driver-Linux-

      - name: Install Rust toolchain (for tauri-driver install only)
        if: steps.cache-tauri-driver.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - name: Install tauri-driver
        if: steps.cache-tauri-driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver

      - name: Install Linux system dependencies
        # Using raw apt-get (not cache-apt-pkgs-action) — webkit2gtk-driver post-install
        # scripts must run via apt to properly register the WebKitWebDriver binary for tauri-driver.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            webkit2gtk-driver \
            xvfb \
            libappindicator3-dev \
            librsvg2-dev

      - name: Download Linux binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mini-diarium-linux-binary
          path: src-tauri/target/release/

      - name: Mark binary executable
        run: chmod +x src-tauri/target/release/mini-diarium

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Run E2E tests (clean mode)
        run: xvfb-run --auto-servernum bun run test:e2e

      - name: Run E2E tests (stateful mode)
        env:
          E2E_STATEFUL_ROOT: ${{ github.workspace }}/.e2e-stateful-ci
        run: xvfb-run --auto-servernum bun run test:e2e:stateful
