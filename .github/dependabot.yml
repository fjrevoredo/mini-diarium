version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Prevent PRs for npm packages newer than 7 days
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
      prod-dependencies:
        dependency-type: production

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Prevent PRs for Rust crates newer than 7 days
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Prevent PRs for Actions newer than 7 days
    cooldown:
      default-days: 7
    ignore:
      # awalsh128/cache-apt-pkgs-action v1.6.2 has an upstream regression:
      # pre_cache_action.sh switched from `${@:6}` (array slice) to `${*:6}`
      # (string slice), which yields garbage for the packages arg. The
      # action aborts with "Packages argument is empty" on every invocation.
      # Tracked in this repo's CI failures from 2026-06-29; re-enable when
      # upstream ships a fix.
      - dependency-name: awalsh128/cache-apt-pkgs-action
        versions:
          - ">= 1.6.2, < 1.7"
