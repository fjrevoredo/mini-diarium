version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Prevent PRs for npm packages newer than 7 days
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
      prod-dependencies:
        dependency-type: production
    # typescript 7 needs typescript-eslint@9+ first; current
    # typescript-eslint@8.x peer range is `>=4.8.4 <6.1.0`. Ignore TS
    # major bumps until the eslint stack is upgraded.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: cargo
    # Repo-root virtual Cargo workspace: the Cargo.lock and all three member
    # manifests (src-tauri/Cargo.toml, crates/mini-diarium-core/Cargo.toml,
    # crates/mini-diarium-crypto/Cargo.toml) live under /, so point Dependabot
    # at the workspace root to cover all three crates. Pointing at /src-tauri
    # would miss the core/crypto crates' deps.
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Prevent PRs for Rust crates newer than 7 days
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Prevent PRs for Actions newer than 7 days
    cooldown:
      default-days: 7
    ignore:
      # awalsh128/cache-apt-pkgs-action v1.6.2 has an upstream regression:
      # pre_cache_action.sh switched from `${@:6}` (array slice) to `${*:6}`
      # (string slice), which yields garbage for the packages arg. The
      # action aborts with "Packages argument is empty" on every invocation.
      # Tracked in this repo's CI failures from 2026-06-29; re-enable when
      # upstream ships a fix.
      - dependency-name: awalsh128/cache-apt-pkgs-action
        versions:
          - ">= 1.6.2, < 1.7"

  - package-ecosystem: docker
    # website/Dockerfile (FROM nginx:alpine) is the only Dockerfile in the
    # shipped repo — .reference/ is gitignored and out of scope.
    directory: /website
    schedule:
      interval: weekly
      day: monday
    # Prevent PRs for Docker base images newer than 7 days
    cooldown:
      default-days: 7
