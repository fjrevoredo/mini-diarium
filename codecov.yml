codecov:
  notify:
    after_n_builds: 2   # wait for both frontend + backend before posting PR status

coverage:
  status:
    project:
      default:
        target: auto
    patch:
      default:
        target: 80%

flags:
  frontend:
    paths:
      - src/
  backend:
    paths:
      - src-tauri/src/
