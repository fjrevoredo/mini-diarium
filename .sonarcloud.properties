# Generated website HTML files share nav/head/footer boilerplate by design.
# Excluding them from copy-paste detection prevents false-positive duplication
# on every new blog post or docs page.
# website/js/ is also generated output: fingerprint-website-assets.mjs writes
# content-addressed copies (js/main.<hash>.js) that are byte-identical to the
# source js/main.js by construction, so the pair is not genuine copy-paste.
sonar.cpd.exclusions=website/**/*.html,website/js/**
