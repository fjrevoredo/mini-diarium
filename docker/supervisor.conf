[unix_http_server]
file=/run/mini-diarium/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/mini-diarium/supervisord.pid
childlogdir=/tmp/supervisor

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/mini-diarium/supervisor.sock

[program:xvnc]
command=/usr/bin/Xvnc :0 -geometry %(ENV_MINI_DIARIUM_VNC_GEOMETRY)s -depth %(ENV_MINI_DIARIUM_VNC_DEPTH)s -localhost yes -SecurityTypes None -AlwaysShared=0 -NeverShared=1
autostart=true
autorestart=true
startsecs=3
priority=10
stdout_logfile=/tmp/supervisor/xvnc.stdout.log
stdout_logfile_maxbytes=0
stderr_logfile=/tmp/supervisor/xvnc.stderr.log
stderr_logfile_maxbytes=0

[program:openbox]
command=/usr/bin/openbox
environment=DISPLAY=":0",HOME="/data/home",XDG_DATA_HOME="/data/xdg/data",XDG_CONFIG_HOME="/data/xdg/config",XDG_STATE_HOME="/data/xdg/state",XDG_CACHE_HOME="/tmp/xdg-cache"
autostart=true
autorestart=true
startsecs=3
priority=20
stdout_logfile=/tmp/supervisor/openbox.stdout.log
stdout_logfile_maxbytes=0
stderr_logfile=/tmp/supervisor/openbox.stderr.log
stderr_logfile_maxbytes=0

[program:mini-diarium]
command=/opt/mini-diarium/bin/mini-diarium
environment=DISPLAY=":0",HOME="/data/home",XDG_DATA_HOME="/data/xdg/data",XDG_CONFIG_HOME="/data/xdg/config",XDG_STATE_HOME="/data/xdg/state",XDG_CACHE_HOME="/tmp/xdg-cache",MINI_DIARIUM_FONTS_DIR="/opt/mini-diarium/fonts"
autostart=true
autorestart=false
startsecs=5
priority=30
stdout_logfile=/tmp/supervisor/mini-diarium.stdout.log
stdout_logfile_maxbytes=0
stderr_logfile=/tmp/supervisor/mini-diarium.stderr.log
stderr_logfile_maxbytes=0

[program:websockify]
command=/usr/bin/websockify 127.0.0.1:6081 127.0.0.1:5900
autostart=true
autorestart=true
startsecs=2
priority=40
stdout_logfile=/tmp/supervisor/websockify.stdout.log
stdout_logfile_maxbytes=0
stderr_logfile=/tmp/supervisor/websockify.stderr.log
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;" -c /opt/mini-diarium/docker/proxy.conf
autostart=true
autorestart=true
startsecs=2
priority=50
stdout_logfile=/tmp/supervisor/nginx.stdout.log
stdout_logfile_maxbytes=0
stderr_logfile=/tmp/supervisor/nginx.stderr.log
stderr_logfile_maxbytes=0

[eventlistener:shutdown-on-app-exit]
command=python3 /opt/mini-diarium/docker/shutdown-on-app-exit.py mini-diarium
events=PROCESS_STATE_EXITED,PROCESS_STATE_FATAL
autorestart=true
buffer_size=10
priority=60
