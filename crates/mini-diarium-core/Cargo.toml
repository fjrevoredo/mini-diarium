[package]
name = "mini-diarium-core"
# Intentionally decoupled from the app crate's version (src-tauri/Cargo.toml).
# `mini-diarium-core` is an internal path dependency; its version is irrelevant
# until distribution is decided (open-core roadmap M4). It is deliberately NOT
# wired into bump-version.sh/.ps1, the pre-release guard, or RELEASING.md.
version = "0.1.0"
edition = "2021"
description = "Tauri-free business layer of Mini Diarium (crypto, auth, db, import/export, plugins)"
authors = ["Francisco J. Revoredo"]
license = "MIT"
repository = "https://github.com/fjrevoredo/mini-diarium"

[lib]
# Defensive, per docs/OPEN_CORE_STRATEGY.md: benches live in the app crate, but
# keep libtest from being invoked here with --output-format bencher.
bench = false

[features]
# Exposes test-only constructors (e.g. `DatabaseConnection::from_parts`) so
# dependent crates can build fixtures in their own test suites. Enabled by the
# app crate as a dev-dependency feature; never enabled in production builds.
test-support = []

[dependencies]
# The reusable, rusqlite-free cryptographic layer (cipher, password hashing, master-key
# wrapping). This crate re-exports its `crypto`/`auth` modules (open-core M3a / TODO-0082),
# so `argon2` and `aes-gcm` live in that crate's manifest, not here. `x25519-dalek`, `hkdf`,
# and `sha2` remain direct deps below — the db layer still names them (keypair-slot lookup
# in db/schema/open.rs; the require_all_auth MAC in db/queries/db_settings.rs).
mini-diarium-crypto = { path = "../mini-diarium-crypto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1.8", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rand = "0.10"
rand_core = "0.6"
hex = "0.4"
x25519-dalek = { version = "3", features = ["static_secrets"] }
hkdf = "0.13"
sha2 = "0.11"
base64 = "0.23"
# `serde` is required: the backup manifest round-trips `SnapshotMeta.created_at`
# (`DateTime<Utc>`) through `manifest.json`, and chrono does not derive serde by default.
chrono = { version = "0.4", features = ["serde"] }
rhai = { version = "1", features = ["serde"] }
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
