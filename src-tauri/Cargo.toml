[package]
name = "mini-diarium"
version = "0.6.5"
description = "A modern, encrypted, local-first desktop journaling application"
authors = ["Francisco J. Revoredo"]
license = "MIT"
repository = "https://github.com/fjrevoredo/mini-diarium"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mini_diarium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
bench = false  # criterion benches live in benches/; lib has no #[bench] items and libtest rejects --output-format bencher

[[bin]]
name = "mini-diarium"
path = "src/main.rs"
bench = false  # entry point only; no bench items — libtest rejects --output-format bencher

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
# The Tauri-free business layer. Pulls in crypto/auth/db/import/export/plugin,
# so the crypto-and-storage deps (argon2, aes-gcm, x25519-dalek, hkdf, sha2,
# rhai, image, …) live in that crate's manifest, not here.
mini-diarium-core = { path = "../crates/mini-diarium-core" }
tauri = { version = "2.11.2", features = ["devtools"] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1.8", features = ["derive"] }
# NOTE: no `rusqlite` here on purpose. The app crate reaches the database only through
# the `mini-diarium-core` façade (open-core M2 / TODO-0077); bundled SQLite arrives
# transitively via that crate. Re-adding it would reopen a second DB access path.
rand = "0.10"
rand_core = "0.6"
hex = "0.4"
base64 = "0.23"
chrono = "0.4"
log = "0.4"
env_logger = "0.11.10"
unicode-normalization = "0.1"
# OS name/version/edition for the debug dump. Depended on directly rather than through
# tauri-plugin-os, which only wraps this crate and would add an init() call, a JS
# package, and capability plumbing for a value nothing but Rust reads.
os_info = "3"

# NOTE: [profile.release] lives in the workspace-root Cargo.toml. Cargo ignores
# [profile.*] in non-root workspace members, so declaring it here would silently
# drop LTO / opt-level=3 from release builds.

[features]
# Production builds outside the Tauri CLI must enable this so the app loads
# embedded frontend assets instead of trying the dev server URL.
default = []
custom-protocol = ["tauri/custom-protocol"]
# Compile and register commands that are not yet ready for production.
# Never set in default builds; CI and releases always use the default feature set.
# Enable during development with: cargo build --features experimental
# (Currently empty — search graduated to production. Kept as the standard gate for the
#  next experimental feature; see docs/decisions/2026-06-feature-flags.md.)
experimental = []

[dev-dependencies]
# Enable core's test-only constructors (e.g. DatabaseConnection::from_parts) for
# the app crate's own tests. This feature is off in normal lib/bin builds.
mini-diarium-core = { path = "../crates/mini-diarium-core", features = ["test-support"] }
tempfile = "3"
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "auth_bench"
harness = false

[[bench]]
name = "backup_bench"
harness = false

[[bench]]
name = "cipher_bench"
harness = false

[[bench]]
name = "db_bench"
harness = false

[[bench]]
name = "word_count_bench"
harness = false

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_RemoteDesktop",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
# Direct deps for WebResourceRequested COM handler in lib.rs
webview2-com = "0.38.2"
windows = { version = "0.61" }

[target.'cfg(target_os = "linux")'.dependencies]
# Direct dep for enabling spell checking on the WebKitWebContext in spellcheck.rs.
# `wry` (via tauri) already depends on webkit2gtk 2.x with the `v2_40` feature, so this
# adds a dependency edge rather than a new package — Cargo.lock and the Flatpak's
# generated cargo-sources.json are unchanged. Keep the version range compatible with
# tauri's so both resolve to the same `webkit2gtk::WebView` type that
# `PlatformWebview::inner()` returns.
webkit2gtk = { version = "2", features = ["v2_40"] }
libloading = "0.9"
# Direct dep for the Wayland title-bar fix in wayland_titlebar.rs (issue #238).
# `tao` (via tauri) already depends on gtk 0.18.2, so this adds a dependency edge
# rather than a new package — Cargo.lock and the Flatpak's generated
# cargo-sources.json are unchanged. The version must track whatever 0.18.x `tao`
# resolves, or `WebviewWindow::gtk_window()` returns a different
# `gtk::ApplicationWindow` type and this stops compiling.
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSWorkspace"] }
objc2-foundation = { version = "0.3", features = [
  "NSDistributedNotificationCenter",
  "NSError",
  "NSNotification",
  "NSOperation",
  "NSString",
] }
# Direct deps for WKContentRuleList handler in lib.rs
objc2 = "0.6"
objc2-web-kit = { version = "0.3", features = [
  "WKContentRuleList",
  "WKContentRuleListStore",
  "WKUserContentController",
  "WKWebView",
  "WKWebViewConfiguration",
] }
block2 = "0.6"
